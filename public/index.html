<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>검사성적서 관리 대시보드</title>
<style>
  :root {
    --bg: #f2f4f9;
    --card-bg: #ffffff;
    --border: #e7eaf1;
    --border-strong: #d6dbe5;
    --text: #161a23;
    --text-muted: #7c8494;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-wash: #eaf1ff;
    --pass: #0d9450;
    --pass-bg: #e6f6ee;
    --fail: #d0342c;
    --fail-bg: #fbeaea;
    --cond: #b45309;
    --cond-bg: #fdf3dd;
    --dark: #12161f;
    --dark-2: #1b2130;
    --shadow: 0 1px 2px rgba(15,23,42,0.04);
    --shadow-md: 0 8px 24px rgba(15,23,42,0.08);
    --radius-lg: 14px;
    --radius-md: 10px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 32px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.3px; margin: 0; color: var(--text); white-space: nowrap; }
  .topbar-stats { display: flex; gap: 14px; align-items: center; flex: 1; }
  .stat {
    display: flex; flex-direction: column; line-height: 1.2;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 22px;
  }
  .stat b { font-size: 27px; font-weight: 800; color: var(--text); letter-spacing: -0.4px; }
  .stat span { font-size: 12px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.3px; margin-top: 2px; }
  .stat.stat-pass { background: var(--pass-bg); border-color: rgba(13,148,80,0.25); }
  .stat.stat-pass b { color: var(--pass); }
  .stat.stat-fail { background: var(--fail-bg); border-color: rgba(208,52,44,0.25); }
  .stat.stat-fail b { color: var(--fail); }
  .header-actions { display: flex; gap: 10px; flex-shrink: 0; }
  .btn {
    border: none;
    border-radius: var(--radius-sm);
    padding: 11px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--border-strong); }
  .btn-secondary:hover { background: var(--bg); border-color: var(--primary); }
  main { max-width: 1520px; margin: 0 auto; padding: 24px 28px 44px; }

  .alert-banner { display: flex; align-items: center; gap: 18px; background: var(--primary-wash); border: 1px solid #cfe0fd; border-radius: var(--radius-lg); padding: 15px 20px; margin-bottom: 22px; cursor: pointer; transition: box-shadow 0.15s; }
  .alert-banner:hover { box-shadow: var(--shadow-md); }
  .alert-banner-tag { flex-shrink: 0; font-size: 13px; font-weight: 700; color: var(--primary-dark); background: #fff; border: 1px solid #cfe0fd; padding: 6px 14px; border-radius: 999px; }
  .alert-banner .schedule-list { flex: 1; }
  .alert-banner .btn { flex-shrink: 0; }
  .schedule-list { font-size: 14.5px; max-height: 64px; overflow-y: auto; line-height: 1.6; }
  .schedule-list .schedule-row { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .schedule-list .schedule-row b { font-weight: 700; margin-right: 6px; color: var(--primary-dark); }
  .schedule-list .schedule-more { color: var(--text-muted); font-size: 12.5px; margin-top: 2px; }
  .schedule-list .schedule-empty { color: var(--text-muted); }

  .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 22px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 22px; border-bottom: 1px solid var(--border); }
  .tabs { display: flex; gap: 24px; }
  .tabs button { background: none; border: none; border-bottom: 2px solid transparent; padding: 16px 2px; font-size: 15px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
  .tabs button.active { color: var(--text); border-bottom-color: var(--primary); }

  .filter-bar { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; padding: 18px 22px; border-bottom: 1px solid var(--border); }
  .filter-item { display: flex; flex-direction: column; gap: 6px; }
  .filter-item label { font-size: 12.5px; font-weight: 600; color: var(--text-muted); }
  input, select, textarea {
    font-family: inherit;
    padding: 9px 12px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: #fff;
    color: var(--text);
    font-size: 14.5px;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-wash); }

  #galleryView { padding: 20px 22px; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 16px 11px; text-align: center; font-size: 13.5px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
  th { background: var(--bg); color: var(--text-muted); font-weight: 700; font-size: 12.5px; letter-spacing: 0.2px; }
  td.num { font-variant-numeric: tabular-nums; }
  td.wrap { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; font-size: 14px; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--bg); }
  .thumb { width: 38px; height: 38px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); }
  .req-link { color: var(--primary); font-weight: 600; text-decoration: none; }
  .req-link:hover { text-decoration: underline; }
  .btn-sm { padding: 5px 11px; font-size: 12.5px; }
  .row-actions { display: flex; gap: 4px; justify-content: center; }

  .badge { display: inline-block; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; }
  .badge.적합 { background: var(--pass-bg); color: var(--pass); }
  .badge.부적합 { background: var(--fail-bg); color: var(--fail); }
  .badge.조건부적합 { background: var(--cond-bg); color: var(--cond); }

  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .gallery-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); cursor: pointer; transition: box-shadow 0.15s, transform 0.15s; }
  .gallery-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .gallery-card img { width: 100%; height: 150px; object-fit: cover; background: var(--bg); }
  .gallery-card .info { padding: 12px; font-size: 13px; }
  .gallery-card .info .title { font-weight: 700; margin-bottom: 4px; }
  .gallery-card .info .sub { color: var(--text-muted); font-size: 12px; }
  .gallery-card .info .actions { display: flex; gap: 6px; margin-top: 10px; }
  .no-photo { display:flex; align-items:center; justify-content:center; color: var(--text-muted); font-size: 12px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.5); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--card-bg); border-radius: 16px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 28px 30px; box-shadow: 0 20px 60px rgba(15,23,42,0.25); }
  .modal h2 { margin: 0 0 20px; font-size: 20px; font-weight: 700; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-item { display: flex; flex-direction: column; gap: 6px; }
  .form-item label { font-size: 13px; font-weight: 600; color: var(--text-muted); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .schedule-item-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .schedule-item-row:last-child { border-bottom: none; }
  #defectWrap, #defectPhotoWrap { display: none; }

  .lightbox-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 200; flex-direction: column; }
  .lightbox-overlay.open { display: flex; }
  .lightbox-overlay img { max-width: 90vw; max-height: 75vh; border-radius: 8px; }
  .lightbox-nav { display: flex; gap: 20px; margin-top: 16px; align-items: center; color: #fff; }
  .lightbox-nav button { background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  .lightbox-close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 28px; cursor: pointer; background: none; border: none; }
  .detail-fields { color: #fff; font-size: 13px; margin-top: 10px; text-align: center; max-width: 600px; }

  .file-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .file-preview img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
  .file-preview .photo-item { position: relative; }
  .file-preview .photo-remove {
    position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--fail); color: #fff; border: none; font-size: 12px; line-height: 1; cursor: pointer;
  }
  .status-msg { font-size: 13px; margin-top: 8px; }
  .status-msg.error { color: var(--fail); }
  .status-msg.info { color: var(--text-muted); }

  @media (max-width: 900px) {
    header { flex-wrap: wrap; height: auto; gap: 12px; }
    .topbar-stats { order: 3; flex-basis: 100%; }
  }
  @media (max-width: 700px) {
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>검사성적서 관리</h1>
  <div class="topbar-stats">
    <div class="stat"><b id="kpiTotal">0</b><span>총 건수</span></div>
    <div class="stat stat-pass"><b id="kpiPass">0</b><span>적합</span></div>
    <div class="stat stat-fail"><b id="kpiFail">0</b><span>부적합 / 조건부</span></div>
    <div class="stat"><b id="kpiRate">0%</b><span>적합률</span></div>
  </div>
  <div class="header-actions">
    <button class="btn btn-secondary" onclick="loadData()">새로고침</button>
    <button class="btn btn-primary" onclick="openRegisterModal()">+ 신규 등록</button>
  </div>
</header>

<main>
  <div class="alert-banner" onclick="openScheduleListModal()">
    <span class="alert-banner-tag">다음검사 일정</span>
    <div class="schedule-list" id="scheduleSummary">로딩중...</div>
    <button type="button" class="btn btn-secondary btn-sm" onclick="event.stopPropagation(); openScheduleRegisterModal()">+ 입고예정 등록</button>
  </div>

  <div class="panel">
    <div class="panel-head">
      <div class="tabs">
        <button id="btnListView" class="active" onclick="switchView('list')">리스트 뷰</button>
        <button id="btnGalleryView" onclick="switchView('gallery')">갤러리 뷰</button>
      </div>
    </div>

    <div class="filter-bar">
      <div class="filter-item">
        <label>시작일</label>
        <input type="date" id="fDateFrom" onchange="applyFilters()" />
      </div>
      <div class="filter-item">
        <label>종료일</label>
        <input type="date" id="fDateTo" onchange="applyFilters()" />
      </div>
      <div class="filter-item">
        <label>업체명</label>
        <input type="text" id="fVendor" placeholder="업체명 검색" oninput="applyFilters()" />
      </div>
      <div class="filter-item">
        <label>품목명</label>
        <input type="text" id="fItem" placeholder="품목명 검색" oninput="applyFilters()" />
      </div>
      <div class="filter-item">
        <label>검사결과</label>
        <select id="fResult" onchange="applyFilters()">
          <option value="">전체</option>
          <option value="적합">적합</option>
          <option value="부적합">부적합</option>
          <option value="조건부적합">조건부적합</option>
        </select>
      </div>
      <button class="btn btn-secondary" onclick="resetFilters()">필터 초기화</button>
      <button class="btn btn-secondary" onclick="exportCsv()">CSV 내보내기</button>
      <button class="btn btn-secondary" onclick="document.getElementById('csvFileInput').click()">CSV 불러오기</button>
      <input type="file" id="csvFileInput" accept=".csv,text/csv" onchange="importCsv(event)" hidden />
    </div>

    <div id="listView">
      <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>문서번호</th>
            <th class="center">검사일자</th>
            <th>업체명</th>
            <th>품목명</th>
            <th>색상</th>
            <th class="num">수량</th>
            <th class="center">검사자</th>
            <th class="center">검사결과</th>
            <th class="center">사진</th>
            <th class="center">검사의뢰서</th>
            <th>비고</th>
            <th class="center">성적서</th>
            <th class="center">전산 성적서</th>
            <th class="center">관리</th>
          </tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
      </div>
      <div class="empty-state" id="listEmpty" style="display:none;">등록된 검사성적서가 없습니다.</div>
    </div>

    <div id="galleryView" class="gallery" style="display:none;"></div>
  </div>
</main>

<!-- 신규 등록 모달 -->
<div class="modal-overlay" id="registerModal">
  <div class="modal">
    <h2 id="registerModalTitle">검사성적서 신규 등록</h2>
    <form id="registerForm">
      <div class="form-grid">
        <div class="form-item">
          <label>검사일자</label>
          <input type="date" id="iDate" required />
        </div>
        <div class="form-item">
          <label>업체명</label>
          <input type="text" id="iVendor" required />
        </div>
        <div class="form-item">
          <label>품목명</label>
          <input type="text" id="iItem" required />
        </div>
        <div class="form-item">
          <label>색상</label>
          <input type="text" id="iColor" />
        </div>
        <div class="form-item">
          <label>Lot No.</label>
          <input type="text" id="iLot" />
        </div>
        <div class="form-item">
          <label>수량</label>
          <input type="number" id="iQty" min="0" />
        </div>
        <div class="form-item">
          <label>검사자</label>
          <input type="text" id="iInspector" />
        </div>
        <div class="form-item">
          <label>검사항목</label>
          <input type="text" id="iInspectionItem" />
        </div>
        <div class="form-item full">
          <label>기준</label>
          <textarea id="iCriteria" rows="4"></textarea>
        </div>
        <div class="form-item">
          <label>검사결과</label>
          <select id="iResult" onchange="toggleDefectField()">
            <option value="적합">적합</option>
            <option value="부적합">부적합</option>
            <option value="조건부적합">조건부적합</option>
          </select>
        </div>
        <div class="form-item full" id="defectWrap">
          <label>불량내용</label>
          <textarea id="iDefect" rows="2"></textarea>
        </div>
        <div class="form-item full" id="defectPhotoWrap">
          <label>불량사진 (여러 장 선택 가능)</label>
          <div class="file-preview" id="existingDefectPhotoPreview"></div>
          <input type="file" id="iDefectPhotos" accept="image/*" multiple onchange="previewDefectPhotos()" />
          <div class="file-preview" id="defectFilePreview"></div>
        </div>
        <div class="form-item full" id="existingPhotoWrap" style="display:none;">
          <label>기존 사진 (x를 누르면 제거됩니다)</label>
          <div class="file-preview" id="existingPhotoPreview"></div>
        </div>
        <div class="form-item full">
          <label>사진 추가 (여러 장 선택 가능)</label>
          <input type="file" id="iPhotos" accept="image/*" multiple onchange="previewPhotos()" />
          <div class="file-preview" id="filePreview"></div>
        </div>
        <div class="form-item full">
          <label>검사의뢰서 링크 (선택)</label>
          <input type="url" id="iRequestDocUrl" placeholder="https://..." />
        </div>
        <div class="form-item full">
          <label>전산 성적서 링크 (선택)</label>
          <input type="url" id="iReportDocUrl" placeholder="https://..." />
        </div>
        <div class="form-item full">
          <label>비고</label>
          <textarea id="iRemarks" rows="2"></textarea>
        </div>
      </div>
      <div class="status-msg info" id="registerStatus"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeRegisterModal()">취소</button>
        <button type="submit" class="btn btn-primary" id="submitBtn">등록</button>
      </div>
    </form>
  </div>
</div>

<!-- 입고예정 등록 모달 -->
<div class="modal-overlay" id="scheduleRegisterModal">
  <div class="modal">
    <h2 id="scheduleModalTitle">입고예정 등록</h2>
    <form id="scheduleForm">
      <div class="form-grid">
        <div class="form-item">
          <label>입고예정일</label>
          <input type="date" id="sDate" required />
        </div>
        <div class="form-item">
          <label>업체명</label>
          <input type="text" id="sVendor" required />
        </div>
        <div class="form-item">
          <label>품목명</label>
          <input type="text" id="sItem" required />
        </div>
        <div class="form-item">
          <label>색상</label>
          <input type="text" id="sColor" />
        </div>
        <div class="form-item full">
          <label>검사의뢰서 링크 (선택)</label>
          <input type="url" id="sRequestDocUrl" placeholder="https://..." />
        </div>
      </div>
      <div class="status-msg info" id="scheduleStatus"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeScheduleRegisterModal()">취소</button>
        <button type="submit" class="btn btn-primary" id="scheduleSubmitBtn">등록</button>
      </div>
    </form>
  </div>
</div>

<!-- 입고예정 목록 모달 -->
<div class="modal-overlay" id="scheduleListModal">
  <div class="modal">
    <h2>입고예정 목록</h2>
    <div id="scheduleListBody"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" onclick="closeScheduleListModal()">닫기</button>
    </div>
  </div>
</div>

<!-- 사진 확대 / 상세보기 -->
<div class="lightbox-overlay" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <img id="lightboxImg" src="" />
  <div class="lightbox-nav">
    <button onclick="lightboxPrev()">‹ 이전</button>
    <span id="lightboxCount"></span>
    <button onclick="lightboxNext()">다음 ›</button>
    <button onclick="downloadCurrentPhoto(this)">사진 다운로드</button>
    <button onclick="downloadAllPhotos(this)">전체 다운로드</button>
  </div>
  <div class="detail-fields" id="lightboxDetail"></div>
</div>

<script>
  let allRecords = [];
  let filteredRecords = [];
  let currentView = 'list';
  let selectedFiles = [];
  let lightboxPhotos = [];
  let lightboxIndex = 0;
  let lightboxRecord = null;
  let editingId = null;
  let keepPhotoUrls = [];
  let selectedDefectFiles = [];
  let keepDefectPhotoUrls = [];

  const DEFAULT_INSPECTION_ITEM = '외관 및 치수';
  const DEFAULT_CRITERIA = '1. 일반공차 ± 0.5 이내\n2. 퍼시스,일룸 이물질 0.4mm² 이내\n3. 평 엣지 및 45° 엣지 트리밍 상태\n4. 조립철물';

  async function loadData() {
    try {
      const res = await fetch('/api/inspections');
      if (!res.ok) throw new Error('서버 응답 오류 (' + res.status + ')');
      allRecords = await res.json();
      applyFilters();
    } catch (err) {
      document.getElementById('listEmpty').style.display = 'block';
      document.getElementById('listEmpty').textContent = '데이터를 불러오지 못했습니다: ' + err.message;
    }
  }
  loadData();

  let scheduledItems = [];
  let editingScheduleId = null;

  async function loadScheduled() {
    try {
      const res = await fetch('/api/scheduled');

  function escapeCsvValue(value) {
    const text = value == null ? '' : String(value);
    return /[",\r\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
  }

  function exportCsv() {
    const rows = [csvFields.map(([, label]) => label)];
    filteredRecords.forEach(record => {
      rows.push(csvFields.map(([field]) => escapeCsvValue(record[field])));
    });
    const csv = '\uFEFF' + rows.map(row => row.join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = '검사성적서_' + new Date().toISOString().slice(0, 10) + '.csv';
    link.click();
    URL.revokeObjectURL(url);
  }

  function parseCsv(text) {
    const rows = [];
    let row = [];
    let value = '';
    let quoted = false;
    for (let index = 0; index < text.length; index += 1) {
      const character = text[index];
      if (character === '"') {
        if (quoted && text[index + 1] === '"') {
          value += '"';
          index += 1;
        } else {
          quoted = !quoted;
        }
      } else if (character === ',' && !quoted) {
        row.push(value);
        value = '';
      } else if ((character === '\n' || character === '\r') && !quoted) {
        if (character === '\r' && text[index + 1] === '\n') index += 1;
        row.push(value);
        if (row.some(cell => cell !== '')) rows.push(row);
        row = [];
        value = '';
      } else {
        value += character;
      }
    }
    if (value || row.length) {
      row.push(value);
      if (row.some(cell => cell !== '')) rows.push(row);
    }
    return rows;
  }

  async function importCsv(event) {
    const input = event.target;
    const file = input.files[0];
    if (!file) return;
    try {
      const text = (await file.text()).replace(/^\uFEFF/, '');
      const rows = parseCsv(text);
      if (rows.length < 2) throw new Error('헤더와 데이터가 있는 CSV 파일을 선택해 주세요.');
      const header = rows[0].map(cell => cell.trim());
      const fieldIndexes = csvFields.map(([, label]) => header.indexOf(label));
      const requiredFields = ['검사일자', '업체명', '품목명'];
      if (requiredFields.some(label => header.indexOf(label) === -1)) {
        throw new Error('검사성적서 CSV 형식의 헤더가 아닙니다.');
      }
      let importedCount = 0;
      for (const row of rows.slice(1)) {
        const record = {};
        csvFields.forEach(([field], index) => {
          const fieldIndex = fieldIndexes[index];
          record[field] = fieldIndex === -1 ? '' : (row[fieldIndex] || '');
        });
        if (!record.inspectionDate || !record.vendor || !record.itemName) {
          throw new Error('검사일자, 업체명, 품목명은 비워둘 수 없습니다.');
        }
        const formData = new FormData();
        csvFields.forEach(([field]) => {
          if (field !== 'inspectionNo') formData.append(field, record[field]);
        });
        const res = await fetch('/api/inspections', { method: 'POST', body: formData });
        if (!res.ok) {
          const errBody = await res.json().catch(() => ({}));
          throw new Error(errBody.error || '서버 응답 오류 (' + res.status + ')');
        }
        importedCount += 1;
      }
      await loadData();
      alert(importedCount + '건을 불러왔습니다.');
    } catch (err) {
      alert('CSV 불러오기에 실패했습니다: ' + err.message);
    } finally {
      input.value = '';
    }
  }

  function triggerBlobDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

  function photoExt(url) {
    const clean = url.split('?')[0];
    const ext = clean.slice(clean.lastIndexOf('.') + 1);
    return ext && ext.length <= 5 ? ext : 'jpg';
  }
  function photoBaseName(r) {
    return [r?.itemName || '', r?.color || ''].filter(Boolean).join('+') || '사진';
  }
  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));

  async function downloadCurrentPhoto(btn) {
    const url = lightboxPhotos[lightboxIndex];
    if (!url) return;
    btn.disabled = true;
    try {
      const res = await fetch(url);
      const blob = await res.blob();
      const base = photoBaseName(lightboxRecord);
      const suffix = lightboxPhotos.length > 1 ? `_${lightboxIndex + 1}` : '';
      triggerBlobDownload(blob, `${base}${suffix}.${photoExt(url)}`);
    } catch (err) {
      alert('다운로드 실패: ' + err.message);
    } finally {
      btn.disabled = false;
    }
  }
  async function downloadAllPhotos(btn) {
    if (!lightboxPhotos.length) return;
    btn.disabled = true;
    const prevText = btn.textContent;
    btn.textContent = '다운로드 중...';
    try {
      const base = photoBaseName(lightboxRecord);
      for (let i = 0; i < lightboxPhotos.length; i++) {
        const url = lightboxPhotos[i];
        const res = await fetch(url);
        const blob = await res.blob();
        triggerBlobDownload(blob, `${base}_${i + 1}.${photoExt(url)}`);
        if (i < lightboxPhotos.length - 1) await sleep(300);
      }
    } catch (err) {
      alert('전체 다운로드 실패: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = prevText;
    }
  }

      const res = await fetch(`/api/inspections/${id}`, { method: 'DELETE' });
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.error || '서버 응답 오류 (' + res.status + ')');
      }
      await loadData();
    } catch (err) {
      alert('삭제 실패: ' + err.message);
    }
  }

  function closeRegisterModal() {
    document.getElementById('registerModal').classList.remove('open');
  }
  function toggleDefectField() {
    const result = document.getElementById('iResult').value;
    const showDefect = result !== '적합';
    document.getElementById('defectWrap').style.display = showDefect ? 'block' : 'none';
    document.getElementById('defectPhotoWrap').style.display = showDefect ? 'block' : 'none';
  }
  function previewPhotos() {
    const input = document.getElementById('iPhotos');
    selectedFiles = Array.from(input.files);
    const preview = document.getElementById('filePreview');
    preview.innerHTML = '';
    selectedFiles.forEach(file => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      preview.appendChild(img);
    });
  }
  function previewDefectPhotos() {
    const input = document.getElementById('iDefectPhotos');
    selectedDefectFiles = Array.from(input.files);
    const preview = document.getElementById('defectFilePreview');
    preview.innerHTML = '';
    selectedDefectFiles.forEach(file => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      preview.appendChild(img);
    });
  }
  function renderExistingDefectPhotoPreview() {
    const preview = document.getElementById('existingDefectPhotoPreview');
    preview.innerHTML = '';
    keepDefectPhotoUrls.forEach((url) => {
      const item = document.createElement('div');
      item.className = 'photo-item';
      item.innerHTML = `<img src="${url}" /><button type="button" class="photo-remove" title="제거">&times;</button>`;
      item.querySelector('.photo-remove').onclick = () => {
        keepDefectPhotoUrls = keepDefectPhotoUrls.filter(u => u !== url);
        renderExistingDefectPhotoPreview();
      };
      preview.appendChild(item);
    });
  }

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    const status = document.getElementById('registerStatus');
    submitBtn.disabled = true;
    status.className = 'status-msg info';
    status.textContent = '등록 중입니다...';

    try {
      const formData = new FormData();
      formData.append('inspectionDate', document.getElementById('iDate').value);
      formData.append('vendor', document.getElementById('iVendor').value.trim());
      formData.append('itemName', document.getElementById('iItem').value.trim());
      formData.append('color', document.getElementById('iColor').value.trim());
      formData.append('lotNo', document.getElementById('iLot').value.trim());
      formData.append('quantity', document.getElementById('iQty').value || '');
      formData.append('inspector', document.getElementById('iInspector').value.trim());
      formData.append('inspectionItem', document.getElementById('iInspectionItem').value.trim());
      formData.append('criteria', document.getElementById('iCriteria').value.trim());
      formData.append('result', document.getElementById('iResult').value);
      formData.append('defectDetail', document.getElementById('iDefect').value.trim());
      formData.append('requestDocUrl', document.getElementById('iRequestDocUrl').value.trim());
      formData.append('reportDocUrl', document.getElementById('iReportDocUrl').value.trim());
      formData.append('remarks', document.getElementById('iRemarks').value.trim());
      selectedFiles.forEach(file => formData.append('photos', file));
      selectedDefectFiles.forEach(file => formData.append('defectPhotos', file));

      let res;
      if (editingId) {
        formData.append('keepPhotos', JSON.stringify(keepPhotoUrls));
        formData.append('keepDefectPhotos', JSON.stringify(keepDefectPhotoUrls));
        res = await fetch(`/api/inspections/${editingId}`, { method: 'PUT', body: formData });
      } else {
        res = await fetch('/api/inspections', { method: 'POST', body: formData });
      }
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.error || '서버 응답 오류 (' + res.status + ')');
      }

      status.className = 'status-msg info';
      status.textContent = editingId ? '수정되었습니다.' : '등록되었습니다.';
      await loadData();
      await loadScheduled();
      setTimeout(closeRegisterModal, 600);
    } catch (err) {
      status.className = 'status-msg error';
      status.textContent = '등록 실패: ' + err.message;
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
